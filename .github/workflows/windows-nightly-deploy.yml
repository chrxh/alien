name: windows-deploy

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:


env:
  BUILD_TYPE: Release
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}

jobs:
  windows-deploy:
    runs-on: [self-hosted, Windows]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        clean: true

    - name: Unshallow vcpkg submodule
      shell: pwsh
      run: |
        cd external/vcpkg
        git fetch --unshallow 2>$null; if (-not $?) { Write-Host "Already unshallowed or fetch failed (continuing)" }
        exit 0

    - name: Bootstrap vcpkg
      shell: pwsh
      run: |
        Push-Location external/vcpkg
        .\bootstrap-vcpkg.bat -disableMetrics
        Pop-Location

    - name: Build (Ninja)
      shell: cmd
      run: build-windows-ninja.bat ${{ env.BUILD_TYPE }}

    - name: Package deployment
      shell: pwsh
      run: |
        # alien.exe, resources/, imgui.ini and the CUDA / MSVC / vcpkg runtime DLLs
        # are already laid out next to the build output by the CMake POST_BUILD
        # steps, so the Release dir is the complete deployment payload.
        $payload = "build-ninja/${{ env.BUILD_TYPE }}"

        # Guard against shipping an archive that only runs on a machine which has
        # the CUDA toolkit or the Visual C++ redistributable installed.
        $required = @("alien.exe", "cudart64_*.dll", "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll", "resources")
        $missing = $required | Where-Object { -not (Get-ChildItem -Path "$payload/$_" -ErrorAction SilentlyContinue) }
        if ($missing) { throw "Deployment payload is incomplete, missing: $($missing -join ', ')" }

        New-Item -ItemType Directory -Force -Path "deploy" | Out-Null
        Compress-Archive -Path "$payload/*" -DestinationPath "deploy/alien-develop.zip" -Force

    - name: Upload to FTP (overwrite alien-develop.zip)
      shell: pwsh
      env:
        FTP_HOST: ${{ secrets.FTP_HOST }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
      run: |
        $url = "ftp://$($env:FTP_HOST):21/$env:FTP_REMOTE_PATH"
        curl.exe --fail-with-body --silent --show-error `
          --user "${env:FTP_USERNAME}:${env:FTP_PASSWORD}" `
          --upload-file "deploy/alien-develop.zip" `
          $url
        if ($LASTEXITCODE -ne 0) { throw "FTP upload failed (curl exit $LASTEXITCODE)" }
